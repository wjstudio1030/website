</head>

<body>

    <div class="cursor"></div>
    <div class="cursor-follower"></div>
    <!--Navbar Section-->
    <nav class="navbar">
        <div class="navbar__container">
            <a href="/" id="navbar__logo">
                <img src="images/WJSTUDIO_LOGO.png" alt="WJ STUDIO Logo" id="navbar__logo--img">
                WJ STUDIO
            </a>

                <li class="navbar__btn">
                    <a href="Tutor.html" class="button">Tutor</a>
                </li>
            </ul>
        </div>
    </nav>
    <!--Hero Section-->
    <div class="main">
        <div class="main__container">

            <div class="main__content hero-text-animate">
                <h1 class="reveal-text">HELLO！</h1>
                <h2 class="reveal-text delay-1">I'M&nbsp;JARVIS</h2>
                <p class="reveal-text delay-2">Wanna hear a tiny tale about my amazing adventures?</p>
                <a href="Memories.html" class="main__btn">
                    <span>Bring&nbsp;&nbsp;Back&nbsp;&nbsp;Memories</span>
                </a>
            </div>

            <a href="https://www.youtube.com/watch?v=Fl4DmKrRQmU" target="_blank" class="main__img--link">
                <div class="main__img--container">
                </div>
            </a>

        </div>

        <div id="gif-overlay" class="gif-overlay">
            <video id="jarvis-video" muted playsinline style="background: transparent;">
                <source src="images/HI_WJ.mov" type="video/quicktime">
        
                <source src="images/HI_WJ.webm" type="video/webm">
            </video>
        </div>
    </div>

    <!-- 🌟 進入網站 3 秒 + 下滑觸發：純白流體微霧與 SVG 動畫幕後舞台 -->
    <div id="intro-animation-overlay" class="intro-overlay">
        <!-- ⚡ HTML5 物理流體微霧渲染引擎 -->
        <canvas id="smokeCanvas"></canvas>

        <!-- ⚡ 專屬 SVG 動畫舞台（漂浮於微霧正上方） -->
        <div id="svg-animation-container" class="svg-container">
            <!-- 0. 最底層主背景：大投影幕 -->
            <img src="WEB_Animation/Projection_screen.svg" alt="Projection Screen" id="stage-screen" class="stage-element">
        
            <!-- 🌟 0.5 投影幕影片層 (嵌入在黑框內，初始隱藏，設定靜音與內聯播放確保 JS 完美控制) -->
            <video id="stage-video" class="stage-element" muted playsinline preload="auto">
                <source src="WEB_Animation/Infinity_Presentation.mp4" type="video/mp4">
            </video>
        
            <!-- 1. 舞台基座：紅台階 -->
            <img src="WEB_Animation/Red_steps.svg" alt="Red Steps" id="stage-steps" class="stage-element">
        
            <!-- 2. 品牌識別：TEDx Logo -->
            <img src="WEB_Animation/Tedx_logo.svg" alt="TEDx Logo" id="stage-logo" class="stage-element">
        
            <!-- 3. 中前層主角：講者 -->
            <img src="WEB_Animation/WJ_Pose1.svg" alt="Presenter" id="stage-presenter" class="stage-element">
        
            <!-- 4. 最前排前景：觀眾群 -->
            <img src="WEB_Animation/Audience.svg" alt="Audience" id="stage-audience" class="stage-element">

            <!-- 🌟 5. 結局歡呼層：改用 GIF 圖片 -->
            <img src="" data-src="WEB_Animation/Clap.gif" alt="Clap" id="stage-clap" class="stage-element layer-hidden">
            
            <!-- 🌟 6. 最高潮特效層：改用 GIF 圖片 -->
            <img src="" data-src="WEB_Animation/Streamers.gif" alt="Streamers" id="stage-streamers"
                class="stage-element layer-hidden">
        </div>
    </div>
    <!--Footer Section-->
    <div class="footer__container">

                    <a href="/">Facebook</a>
                    <a href="/">Youtube</a>
                    <a href="/">Twitter</a>
                </div>
            </div>
        </div>-->
        <div class="social__media">
            <div class="social__media--wrap">
                <div class="footer__logo">

                <div class="social__icons">
