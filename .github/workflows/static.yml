name: Deploy complete WJ STUDIO website to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare site assets and existing HTML pages
        shell: bash
        run: |
          mkdir -p public-site
          rsync -a \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/public-site/' \
            --exclude='/node_modules/' \
            --exclude='/.env*' \
            --exclude='*.ps1' \
            --exclude='*.log' \
            --exclude='*.bak*' \
            --exclude='*.zip' \
            ./ public-site/
          touch public-site/.nojekyll
          test -f public-site/index.html
          test -f public-site/Technology/Tutor/home-course-redesign.js
      - name: Setup Node for Vite game
        if: ${{ hashFiles('Game.vite.html') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bundle embedded GAME for GitHub Pages
        shell: bash
        run: |
          if [[ -f Game.vite.html ]]; then
            if [[ ! -f package.json ]]; then
              echo 'ERROR: Game.vite.html exists but package.json is missing.' >&2
              exit 1
            fi
            if [[ -f package-lock.json ]]; then
              npm ci --no-audit --no-fund
            else
              npm install --no-audit --no-fund
            fi
            if [[ ! -x node_modules/.bin/vite ]]; then
              echo 'ERROR: Vite must be listed as a project dependency.' >&2
              exit 1
            fi
            cat > vite.pages.temp.config.mjs <<'VITE_CONFIG'
          import { defineConfig } from 'vite';
          import { resolve } from 'node:path';
          export default defineConfig({
            base: '/website/',
            build: {
              outDir: 'public-site',
              emptyOutDir: false,
              rollupOptions: {
                input: { game: resolve(process.cwd(), 'Game.vite.html') }
              }
            }
          });
          VITE_CONFIG
            ./node_modules/.bin/vite build --config vite.pages.temp.config.mjs
          fi
      - name: Verify deployed website entrypoints
        shell: bash
        run: |
          test -f public-site/index.html
          test -f public-site/Tutor.html
          test -f public-site/Memories.html
          test -f public-site/Technology/Tutor/home-course-redesign.css
          test -f public-site/Technology/Tutor/home-course-redesign.js
          test -f public-site/Technology/Game/game-embed.js
          test -f public-site/Game.vite.html
          grep -q 'https://formspree.io/f/xzeeoybl' public-site/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4